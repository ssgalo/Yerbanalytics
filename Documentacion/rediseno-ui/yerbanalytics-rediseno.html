function dock(def, params) {
  const actual = '/' + params.path.replace(/^\//, '');
  const todas = SCREEN_ORDER.flatMap((id) => [SCREENS[id].path || '/' + id, ...(SCREENS[id].states || []).map((x) => x[1])]);
  const exacta = todas.includes(actual);
  const opts = SCREEN_ORDER.filter((id) => !SCREENS[id].hidden).map((id) => {
    const sc = SCREENS[id];
    const base = sc.path || '/' + id;
    const main = `<option value="${base}" ${sc === def && (actual === base || !exacta) ? 'selected' : ''}>${sc.title}</option>`;
    const st = (sc.states || []).map(([t, pth]) => `<option value="${pth}" ${actual === pth ? 'selected' : ''}>  · ${t}</option>`).join('');
    return main + st;
  }).join('');
  const n = notasDe(def, params).length;
  return `<div class="dock" role="region" aria-label="Controles del prototipo">
    <span class="dock-tag">Prototipo</span>
    <select class="dock-sel" aria-label="Ir a pantalla">${opts}</select>
    <button class="dock-btn" data-act="notas" aria-pressed="${estadoUI.notas}">${ico('nota', 16)} Notas <b>${n}</b></button>
    <button class="dock-btn" data-act="movil">${ico('celular', 16)} Ver en celular</button>
  </div>`;
}

function movilPreview(path) {
  const url = location.pathname + '?embed=1#' + path;
  return `<div class="scrim movil-scrim" data-act="cerrar-movil">
    <div class="movil-frame" onclick="event.stopPropagation()">
      <div class="row" style="justify-content:space-between;margin-bottom:10px;color:#fff"><span class="small">Vista de celular, 390 × 844</span><button class="dock-btn" data-act="cerrar-movil">${ico('x', 16)} Cerrar</button></div>
      <iframe src="${url}" title="Vista de celular" width="390" height="844"></iframe>
    </div>
  </div>`;
}

/* ── router ───────────────────────────────────────────────────────────── */
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/indice';
  const parts = h.split('?')[0].split('/').filter(Boolean);
  const q = new URLSearchParams(h.split('?')[1] || '');
  return { parts, q, path: h };
}

function resolve() {
  const { parts, q, path } = parseHash();
  const [a, b, c] = parts;
  let id = a;
  if (a === 'reglas' && b === 'inspector') id = 'reglas-inspector';
  const def = SCREENS[id] || SCREENS.indice;
  return { def, params: { a, b, c, q, path } };
}

let movilAbierto = false;
function render() {
  const { def, params } = resolve();
  const root = document.getElementById('root');
  document.title = `${def.title} · Yerbanalytics (rediseño)`;
  if (def.bare) {
    root.innerHTML = def.render(params) + (EMBED ? '' : dock(def, params)) + (movilAbierto ? movilPreview(params.path) : '');
  } else {
    const crumbs = typeof def.crumbs === 'function' ? def.crumbs(params) : def.crumbs || [[def.title]];
    const nav = typeof def.nav === 'function' ? def.nav(params) : def.nav;
    root.innerHTML = `
      <a class="skip" href="#contenido" onclick="event.preventDefault();document.getElementById('contenido').focus()">Saltar al contenido</a>
      <div class="app ${estadoUI.notas ? 'con-notas' : ''} ${params.q.get('presentacion') ? 'presentacion' : ''}">
        ${sidebar(nav)}
        <div class="main">
          ${topbar(crumbs)}
          <main class="page" id="contenido" tabindex="-1">${def.render(params)}</main>
        </div>
        ${tabbar(nav)}
      </div>
      ${estadoUI.notas && !EMBED ? notasPanel(def, params) : ''}
      ${EMBED ? '' : dock(def, params)}
      ${movilAbierto ? movilPreview(params.path) : ''}`;
  }
  root.classList.toggle('show-pins', estadoUI.notas);
  if (def.after) def.after(root, params);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    if (estadoUI.alertas && !e.target.closest('.popover')) { estadoUI.alertas = false; render(); }
    return;
  }
  const act = t.dataset.act;
  if (act === 'notas') { estadoUI.notas = !estadoUI.notas; render(); }
  else if (act === 'alertas') { estadoUI.alertas = !estadoUI.alertas; render(); }
  else if (act === 'movil') { movilAbierto = true; render(); }
  else if (act === 'cerrar-movil') { if (e.target === t || t.classList.contains('dock-btn')) { movilAbierto = false; render(); } }
  else if (act === 'ir') { location.hash = t.dataset.href; }
  else if (act === 'toggle') {
    /* alterna un atributo genérico: data-target = selector, data-attr = atributo */
    const el = document.querySelector(t.dataset.target);
    if (el) el.toggleAttribute(t.dataset.attr || 'hidden');
    if (t.hasAttribute('aria-expanded')) t.setAttribute('aria-expanded', t.getAttribute('aria-expanded') !== 'true');
  } else if (act === 'press') {
    /* grupo de botones tipo radio dentro del mismo contenedor */
    t.parentElement.querySelectorAll('[aria-pressed]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    t.setAttribute('aria-pressed', 'true');
  } else if (act === 'switch') {
    t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true');
  }
});
document.addEventListener('change', (e) => {
  if (e.target.classList.contains('dock-sel')) location.hash = e.target.value;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (movilAbierto) { movilAbierto = false; render(); return; }
    if (estadoUI.alertas) { estadoUI.alertas = false; render(); return; }
    const cerrar = document.querySelector('[data-cerrar]');
    if (cerrar) location.hash = cerrar.getAttribute('data-cerrar');
  }
});
window.addEventListener('hashchange', () => { estadoUI.alertas = false; movilAbierto = false; render(); window.scrollTo(0, 0); });
window.addEventListener('DOMContentLoaded', render);

function trayHTML(z, { link = true, compact = false } = {}) {
  const cells = z.sectores.map((st, i) => `<i class="cell is-${st}" title="${z.id}-${String(i + 1).padStart(3, '0')}: ${ESTADO[st].label}"></i>`).join('');
  const n = z.nodo;
  const nodoTxt = n.viejo
    ? `<span class="warn-txt">${ico('reloj', 13)} nodo: ${n.ultimo}</span>`
    : n.bat < 20
      ? `<span class="warn-txt">${ico('bateria', 13)} batería ${n.bat} %</span>`
      : n.dbm < -85
        ? `<span class="warn-txt">${ico('senal', 13)} señal débil</span>`
        : `<span>nodo: ${n.ultimo}</span>`;
  const c = z.counts;
  const foot = [
    c.ok ? `<span>${g('ok')} <b>${c.ok}</b></span>` : '',
    c.obs ? `<span>${g('obs')} <b>${c.obs}</b></span>` : '',
    c.crit ? `<span>${g('crit')} <b>${c.crit}</b></span>` : '',
    c.off ? `<span>${g('off')} <b>${c.off}</b></span>` : '',
  ].join('');
  const causa = z.causa
    ? `<div class="tray-cause ${z.causa.st === 'obs' ? 'is-obs' : ''}">${ico(z.causa.st === 'crit' ? 'alerta' : 'info', 14)}<span>${z.causa.texto}</span></div>`
    : `<div class="tray-cause is-ok">${ico('check', 14)}<span>Lectura de la zona dentro del ideal</span></div>`;
  const tag = link ? 'a' : 'div';
  const label = `${z.nombre}, ${z.sub}: ${c.ok} saludables, ${c.obs} en observación, ${c.crit} críticos, ${c.off} fuera de servicio`;
  return `<${tag} class="tray" ${link ? `href="#/zona/${z.id}" aria-label="${label}"` : ''}>
    <div class="tray-head"><span class="tray-code">${z.id}</span><span class="tray-sub">${z.sub}</span><span class="tray-node" title="Nodo testigo ${n.dev}">${nodoTxt}</span></div>
    <div class="tray-grid" aria-hidden="true">${cells}</div>
    <div class="tray-foot">${foot}</div>
    ${compact ? '' : causa}
    ${!compact && z.causa && z.causa.accion ? `<div class="tray-act">${ico(z.id === 'MZ-3' ? 'pausa' : 'refrescar', 14)}<span>${z.causa.accion}</span></div>` : ''}
  </${tag}>`;
}

function leyendaEstados(conConteo = true) {
  const t = TOTALES;
  const it = (st, n) => `<span>${g(st)} ${ESTADO[st].label}${conConteo ? ` <b>${n}</b>` : ''}</span>`;
  return `<div class="legend">${it('ok', t.ok)}${it('obs', t.obs)}${it('crit', t.crit)}${it('off', t.off)}</div>`;
}

function composicion() {
  const t = TOTALES, tot = 600;
  const seg = (st) => `<i class="is-${st}" style="flex:${t[st]}" title="${ESTADO[st].label}: ${t[st]}"></i>`;
  return `<div class="compbar" role="img" aria-label="600 sectores: ${t.ok} saludables, ${t.obs} en observación, ${t.crit} críticos, ${t.off} fuera de servicio">${seg('ok')}${seg('obs')}${seg('crit')}${seg('off')}</div>`;
}

const pad3 = (n) => String(n).padStart(3, '0');

/* Estado del riego por sector en la zona que está regando por tandas (MZ-4). */
function riegoDe(z, i) {
  if (z.id !== 'MZ-4') return null;
  const st = z.sectores[i];
  if (st === 'off') return 'off';
  if (i < 20) return 'regado';
  if (i < 30) return 'regando';
  return 'cola';
}

function zgridHTML(z, capa) {
  return `<div class="zgrid" role="grid" aria-label="Sectores de ${z.id}" data-capa="${capa}">${z.sectores.map((st, i) => {
    const id = `${z.id}-${pad3(i + 1)}`;
    if (capa === 'riego') {
      const r = riegoDe(z, i) || 'cerrada';
      const lab = { regado: 'regado hoy', regando: 'regando ahora', cola: 'en cola', off: 'sin señal', cerrada: 'válvula cerrada' }[r];
      return `<a class="zcell rz-${r}" href="#/sector/${id}" aria-label="Sector ${id}: ${lab}" title="${id}: ${lab}"><span>${r === 'regando' ? ico('riego', 14) : r === 'regado' ? ico('check', 13) : i + 1}</span></a>`;
    }
    const diag = (DIAG_ZONA[z.id] || []).find((d) => d.n === i + 1);
    const lab = `${ESTADO[st].label}${diag ? `, ${diag.clase.toLowerCase()} ${diag.conf} %` : ''}`;
    return `<a class="zcell is-${st}${diag ? ' has-diag' : ''}" href="#/sector/${id}" aria-label="Sector ${id}: ${lab}" title="${id}: ${lab}"><span>${i + 1}</span></a>`;
  }).join('')}</div>`;
}

function chartHTML(z, key, rango = '7d') {
  const s = SPEC[key];
  const n = rango === '24h' ? 24 : rango === '7d' ? 28 : 30;
  const vals = serie(z, key, n, rango.length);
  const W = 560, H = 210, L = 44, R = 12, T = 12, B = 26;
  const lo = s.crit[0], hi = s.crit[1];
  const y = (v) => T + (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * (H - T - B);
  const x = (i) => L + (i * (W - L - R)) / (n - 1);
  const band = (a, b, fill) => `<rect x="${L}" y="${y(b).toFixed(1)}" width="${W - L - R}" height="${(y(a) - y(b)).toFixed(1)}" fill="${fill}"/>`;
  const bands = band(lo, hi, '#fbe3dd') + band(s.warn[0], s.warn[1], '#fbf0d9') + band(s.ideal[0], s.ideal[1], '#dcefe3');
  const ticks = [s.warn[0], s.ideal[0], s.ideal[1], s.warn[1]].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#fff" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" class="ax">${fmt(v, s.dec)}</text>`).join('');
  const colorDe = (v) => ({ ok: '#1e6b41', obs: '#a8730f', crit: '#b6361f' })[estadoMetrica(v, s)];
  let segs = '';
  for (let i = 1; i < n; i++) segs += `<line x1="${x(i - 1).toFixed(1)}" y1="${y(vals[i - 1]).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(vals[i]).toFixed(1)}" stroke="${colorDe(vals[i])}" stroke-width="2.2" stroke-linecap="round"/>`;
  const etiquetas = rango === '24h' ? ['15 h', '21 h', '03 h', '09 h', 'ahora'] : rango === '7d' ? ['mié 30', 'jue 1', 'sáb 3', 'lun 5', 'hoy'] : ['7 sep', '14 sep', '21 sep', '28 sep', 'hoy'];
  const xl = etiquetas.map((t, i) => `<text x="${L + (i * (W - L - R)) / 4}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}" class="ax">${t}</text>`).join('');
  const last = vals[n - 1];
  const mn = Math.min(...vals), mx = Math.max(...vals);
  return `<figure class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.label} en ${z.id}, últimos ${rango}: mínimo ${fmt(mn, s.dec)}, máximo ${fmt(mx, s.dec)}, ahora ${fmt(last, s.dec)} ${s.unit}">
      ${bands}${ticks}${segs}
      <circle cx="${x(n - 1)}" cy="${y(last)}" r="4.5" fill="${colorDe(last)}" stroke="#fff" stroke-width="2"/>
      ${xl}
    </svg>
    <figcaption class="row wrap" style="gap:6px 16px">
      <span class="legend"><span><i class="sw" style="background:#dcefe3"></i>Ideal ${fmt(s.ideal[0], s.dec)}–${fmt(s.ideal[1], s.dec)}</span><span><i class="sw" style="background:#fbf0d9"></i>Observación</span><span><i class="sw" style="background:#fbe3dd"></i>Crítico</span></span>
      <span class="meta" style="margin-left:auto">Mín. ${fmt(mn, s.dec)} · máx. ${fmt(mx, s.dec)} ${s.unit}</span>
    </figcaption>
  </figure>`;
}

function metricaRow(z, s, abierta, rango) {
  const v = z.lectura[s.key];
  const st = estadoMetrica(v, s);
  const palabra = st === 'ok' ? 'en el ideal' : v < s.ideal[0] ? (st === 'crit' ? 'muy bajo' : 'bajo') : st === 'crit' ? 'muy alto' : 'alto';
  const href = abierta ? `#/zona/${z.id}` : `#/zona/${z.id}?metrica=${s.key}`;
  return `<li class="mrow ${abierta ? 'is-open' : ''}">
    <a class="mrow-btn" href="${href}" aria-expanded="${abierta}">
      <span class="mrow-label">${s.label}<span class="mrow-st ${s.afecta ? 'st-' + st : 'st-info'}">${s.afecta ? g(st) : ''}${palabra}</span></span>
      <span class="mrow-val"><b>${fmt(v, s.dec)}</b> <span class="meta">${s.unit}</span></span>
      <span class="mrow-bar">${rangebar(v, s)}</span>
      <span class="mrow-chev">${ico(abierta ? 'arriba' : 'abajo', 16)}</span>
    </a>
    ${abierta ? `<div class="mrow-detail">
      <div class="row wrap" style="gap:10px;margin-bottom:10px">
        <span class="small muted">Histórico del nodo testigo</span>
        <div class="seg" style="margin-left:auto" role="group" aria-label="Período">${['24h', '7d', '30d'].map((r) => `<button data-act="press" aria-pressed="${r === rango}">${r === '24h' ? '24 h' : r === '7d' ? '7 días' : '30 días'}</button>`).join('')}</div>
      </div>
      ${chartHTML(z, s.key, rango)}
      ${s.nota ? `<p class="meta" style="margin-top:8px">${s.nota}</p>` : ''}
    </div>` : ''}
  </li>`;
}

function rustiBar(compacto) {
  const r = RUSTIFICACION;
  return `<div class="rusti" role="img" aria-label="Plan de rustificación: día ${r.dia} de ${r.total}">
    ${r.etapas.map((e, i) => `<div class="rusti-et ${r.dia >= e.d[0] && r.dia <= e.d[1] ? 'is-now' : r.dia > e.d[1] ? 'is-done' : ''}" style="flex:${e.d[1] - e.d[0] + 1}">
      <span class="rusti-ap" style="height:${e.ap}%"></span>
      ${compacto ? '' : `<span class="rusti-lab">Etapa ${i + 1}</span>`}
      <span class="rusti-pct">${e.ap} %</span>
    </div>`).join('')}
    <span class="rusti-hoy" style="left:${((r.dia - 0.5) / r.total) * 100}%"><span>hoy</span></span>
  </div>
  <div class="rangebar-scale"><span>día 1</span><span>día 8</span><span>día 15</span><span>día 22</span><span>día 30</span></div>`;
}

/* ==========================================================================
   Detalle de sector. Rutas:
   #/sector/MZ-1-010            caso principal (crítico por diagnóstico)
   #/sector/MZ-1-010?foto=1     foto a pantalla completa
   #/sector/MZ-1-010?accionar=riego   accionar un actuador a mano (confirmación)
   #/sector/MZ-3-071            sector bloqueado a mano
   #/sector/MZ-4-025            sector crítico por la lectura de la zona, regando
   ========================================================================== */
function sectorInfo(id) {
  const [, zn, num] = id.match(/^(MZ-\d)-(\d{3})$/) || [null, 'MZ-1', '010'];
  const z = ZONAS.find((x) => x.id === zn) || ZONAS[0];
  const i = parseInt(num, 10) - 1;
  const st = z.sectores[i] || 'ok';
  const d = (DIAG_ZONA[z.id] || []).find((x) => x.n === i + 1);
  const img = d ? (d.clase === 'Clorosis' ? IMG.clorosis[0] : d.clase === 'Estrés solar' ? IMG.estres[1] : d.clase === 'No concluyente' ? IMG.nc[0] : d.sub === 'daño fúngico' ? IMG.fungico[0] : IMG.plaga[0]) : IMG.clorosis[2];
  return { id, z, i, st, d, img, num };
}

function sectorSVG() {
  const tub = (x0, y0) => { let o = ''; for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) o += `<circle cx="${x0 + 9 + c * 15}" cy="${y0 + 9 + r * 15}" r="5.2"/>`; return o; };
  return `<svg viewBox="0 0 260 214" class="sector-svg" role="img" aria-label="Un sector: 4 bandejas de 25 tubetes, un microaspersor al centro y el riel con la cámara por arriba">
    <rect x="6" y="8" width="248" height="5" rx="2.5" class="s-riel"/>
    <rect x="116" y="15" width="28" height="15" rx="3" class="s-cam"/><circle cx="130" cy="22.5" r="4" class="s-lente"/>
    <text x="150" y="27" class="s-txt">riel y cámara</text>
    <g class="s-band"><rect x="40" y="44" width="84" height="80" rx="6"/><rect x="136" y="44" width="84" height="80" rx="6"/><rect x="40" y="130" width="84" height="80" rx="6"/><rect x="136" y="130" width="84" height="80" rx="6"/></g>
    <g class="s-tub">${tub(43, 47)}${tub(139, 47)}${tub(43, 133)}${tub(139, 133)}</g>
    <circle cx="130" cy="127" r="66" class="s-area"/>
    <circle cx="130" cy="127" r="6" class="s-asp"/>
  </svg>`;
}

  const d = info.d || { clase: 'Sano', conf: 93 };

function confBar(conf, min = 85, msg = null) {
  const ok = conf >= min;
  return `<div class="conf-wrap">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="small">Confianza del modelo</span><b class="num-m" style="font-size:1.25rem">${conf} %</b></div>
    <div class="conf ${ok ? '' : 'is-low'}" role="img" aria-label="Confianza ${conf} %, mínimo para actuar ${min} %"><i style="width:${conf}%"></i><span class="thr" style="left:${min}%" data-thr="mín. ${min} %"></span></div>
    <p class="meta" style="margin-top:8px">${msg || (ok ? 'Alcanza el mínimo para que el motor actúe.' : 'No alcanza el mínimo: el motor no actúa con este diagnóstico.')} <a class="link" href="#/reglas?param=diagnostico.confianza-minima">Mínimo: ${min} %</a></p>
  </div>`;
}

/* ==========================================================================
   Diagnósticos de IA. Rutas:
   #/diagnosticos                  pestaña "Para revisar"
   #/diagnosticos?vista=todos      todos los sectores, con resumen y filtros
   #/diagnosticos?vista=todos&vacio=1   estado vacío por filtros
   #/diagnosticos/D-2289           revisión de una foto (modal)
   ========================================================================== */
const REVISAR = [
  ...DIAGS.filter((d) => d.revisar || d.baja),
  { id: 'D-2275', sector: 'MZ-3-044', clase: 'No concluyente', sub: 'Foto movida', conf: 51, hora: '11:40', img: IMG.nc[1], revisar: true },
  { id: 'D-2271', sector: 'MZ-5-018', clase: 'Daño biótico', sub: 'Plaga foliar', conf: 81, hora: '11:02', img: IMG.plaga[2], baja: true },
  { id: 'D-2266', sector: 'MZ-4-009', clase: 'No concluyente', sub: 'Reflejo del sol', conf: 39, hora: '10:31', img: IMG.nc[0], revisar: true },
  { id: 'D-2260', sector: 'MZ-2-058', clase: 'Estrés solar', sub: '', conf: 77, hora: '09:58', img: IMG.estres[2], baja: true },
  { id: 'D-2254', sector: 'MZ-6-090', clase: 'Clorosis', sub: '', conf: 83, hora: '09:20', img: IMG.clorosis[0], baja: true },
];

function motivoRevision(d) {
  return d.revisar ? `No concluyente: ${d.sub.toLowerCase()}` : `${d.clase}${d.sub ? ` (${d.sub.toLowerCase()})` : ''} con ${d.conf} %, bajo el mínimo de 85 %`;
}

function diagCard(d, modo) {
  const zona = d.sector.slice(0, 4);
  return `<article class="dcard">
    <a class="photo dcard-foto" href="#/diagnosticos/${d.id}" aria-label="Revisar la foto de ${d.sector}"><img src="${d.img}" alt="" loading="lazy"><span class="photo-cap">Hoy ${d.hora}</span></a>
    <div class="dcard-body">
      <div class="row" style="gap:8px;align-items:baseline"><a class="mono-id dcard-t" href="#/sector/${d.sector}">${d.sector}</a><span class="meta">Macro-zona ${zona.slice(-1)}</span></div>
      ${modo === 'revisar'
        ? `<p class="small" style="min-height:2.7em">${motivoRevision(d)}</p>`
        : `<p class="small"><b>${d.clase}</b>${d.sub ? `, ${d.sub.toLowerCase()}` : ''}</p>`}
      <div class="conf conf-sm ${d.conf >= 85 ? '' : 'is-low'}" role="img" aria-label="Confianza ${d.conf} %"><i style="width:${d.conf}%"></i><span class="thr" style="left:85%"></span></div>
      <div class="row" style="justify-content:space-between"><span class="meta">Confianza ${d.conf} %</span>${modo === 'revisar' ? '' : d.conf >= 85 && d.clase !== 'No concluyente' ? chip('is-sys', 'Habilita acción') : chip('is-obs', 'Para revisar')}</div>
      ${modo === 'revisar' ? `<div class="row" style="gap:6px;margin-top:4px"><a class="btn btn-sm btn-primary" href="#/diagnosticos/${d.id}">Revisar</a><button class="btn btn-sm">${ico('camara', 14)} Pedir foto</button></div>` : ''}
    </div>
  </article>`;
}

function revisionModal(d, idx, total) {
  const opciones = ['Sano', 'Clorosis', 'Estrés solar', 'Daño biótico', 'No se puede saber con esta foto'];
  return `<div class="scrim" data-cerrar="#/diagnosticos">
    <div class="modal modal-rev" role="dialog" aria-modal="true" aria-labelledby="t-rev">
      <div class="modal-foto">
        <img src="${d.img}" alt="Foto cenital del plantín del sector ${d.sector}">
        <span class="photo-cap">Imagen original, sin recortar</span>
        <div class="foto-tools"><button class="icon-btn" aria-label="Acercar">${ico('mas', 16)}</button><button class="icon-btn" aria-label="Alejar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button></div>
        <a class="foto-nav prev" href="#/diagnosticos/${REVISAR[Math.max(0, idx - 1)].id}" aria-label="Foto anterior">${ico('izq', 20)}</a>
        <a class="foto-nav next" href="#/diagnosticos/${REVISAR[Math.min(REVISAR.length - 1, idx + 1)].id}" aria-label="Foto siguiente">${ico('der', 20)}</a>
      </div>
      <div class="modal-info">
        <div class="row"><span class="meta">${idx + 1} de ${total} para revisar</span><a class="icon-btn is-plain" href="#/diagnosticos" aria-label="Cerrar" style="margin-left:auto">${ico('x', 18)}</a></div>
        <div><h2 class="display h1" id="t-rev"><a href="#/sector/${d.sector}" style="text-decoration:none">${d.sector}</a></h2><p class="meta">Macro-zona ${d.sector[3]}, foto de hoy ${d.hora}, captura C-${8800 - idx * 7}</p></div>
        <div class="callout ${d.revisar ? 'is-obs' : ''}">${ico(d.revisar ? 'alerta' : 'info', 18)}<span><b>El modelo dijo: ${d.clase}${d.sub && !d.revisar ? `, ${d.sub.toLowerCase()}` : ''}</b>, con ${d.conf} % de confianza. ${d.revisar ? `Motivo: ${d.sub.toLowerCase()}.` : 'No alcanza el mínimo de 85 %, así que el motor no actuó.'}</span></div>
        <fieldset class="opciones"><legend class="label">¿Qué ves en la foto?</legend>
          ${opciones.map((o, i) => `<label class="opcion"><input type="radio" name="op" ${i === (d.clase === 'Clorosis' ? 1 : d.clase === 'Estrés solar' ? 2 : d.clase === 'Daño biótico' ? 3 : -1) ? 'checked' : ''}><span>${o}</span></label>`).join('')}
        </fieldset>
        <div class="field"><label class="label" for="obs">Nota <span class="meta">(opcional)</span></label><input class="input" id="obs" placeholder="Ej.: manchas en las hojas de abajo"></div>
        <div class="row wrap" style="gap:8px;margin-top:auto"><button class="btn btn-primary">Guardar revisión</button><button class="btn">${ico('camara', 16)} Pedir foto nueva</button></div>
        <p class="meta">Tu revisión queda en el historial del sector con tu nombre. Si confirmás una anomalía, el motor la usa en la próxima evaluación.</p>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   Historial. Rutas:
   #/historial                     feed por día con un evento abierto (receta)
   #/historial?evento=E-14:26      abrir otro evento
   #/historial?exportar=1          exportar
   ========================================================================== */

/* "Receta" de una decisión: componente único para Historial e Inspector. */
function recetaHTML(r) {
  const pasoCls = { actuo: 'is-act', pospuso: 'is-now', corto: 'is-block', nada: '', noaplica: 'is-skip' };
  return `<div class="receta">
    <div class="receta-head ${r.tono ? 'is-' + r.tono : ''}">
      <span class="receta-ico">${ico(r.icono, 20)}</span>
      <div><p class="receta-t">${r.titular}</p><p class="small">${r.bajada}</p></div>
      ${r.codigo ? `<span class="code-badge">${r.codigo}</span>` : ''}
    </div>
    <h4 class="receta-sub">Por qué</h4>
    <ol class="steps">${r.porque.map((p) => `<li class="step ${pasoCls[p.estado] || ''}">
        <span class="step-dot">${p.estado === 'actuo' ? ico('check', 14) : p.estado === 'pospuso' ? ico('pausa', 14) : p.estado === 'corto' ? ico('x', 14) : ico('check', 14)}</span>
        <div><p class="strong">${p.titulo} ${p.codigo ? `<span class="code-badge sm">${p.codigo}</span>` : ''}</p>
          <ul class="cond-list">${p.conds.map((c) => `<li class="cond-item"><span class="${c.ok ? 'ok' : 'no'}" aria-label="${c.ok ? 'se cumple' : 'no se cumple'}">${c.ok ? '✔' : '✖'}</span><span>${c.txt}</span>${c.param ? `<a class="link small" href="#/reglas?param=${c.param}">Ajustar</a>` : ''}</li>`).join('')}</ul>
        </div></li>`).join('')}</ol>
    <details class="receta-mas"><summary>${ico('der', 14)} Chequeos previos sin novedad (${r.previos.length})</summary>
      <ul class="cond-list">${r.previos.map((c) => `<li class="cond-item"><span class="ok">✔</span><span>${c}</span></li>`).join('')}</ul>
    </details>
    <h4 class="receta-sub">Otras etapas</h4>
    <ul class="cond-list">${r.otras.map((c) => `<li class="cond-item"><span class="no">–</span><span>${c}</span></li>`).join('')}</ul>
    <p class="meta receta-pie">${ico('check', 13)} ${r.pie}</p>
  </div>`;
}

function bandEditor(s, marcas) {
  const lo = s.crit[0] - (s.crit[1] - s.crit[0]) * 0.12, hi = s.crit[1] + (s.crit[1] - s.crit[0]) * 0.12;
  const pos = (v) => ((v - lo) / (hi - lo)) * 100;
  const seg = (a, b, cls) => `<span class="band-seg ${cls}" style="left:${pos(a)}%;width:${pos(b) - pos(a)}%"></span>`;
  const dec = s.dec;
  return `<div class="band-row">
    <div class="band-label"><b>${s.label}</b> <span class="meta">${s.unit}</span>${s.afecta ? '' : '<span class="chip is-line" style="height:20px;margin-left:6px">informativa</span>'}</div>
    <div class="band">
      ${seg(lo, s.crit[0], 'b-crit')}${seg(s.crit[0], s.warn[0], 'b-crit')}${seg(s.warn[0], s.ideal[0], 'b-obs')}${seg(s.ideal[0], s.ideal[1], 'b-ok')}${seg(s.ideal[1], s.warn[1], 'b-obs')}${seg(s.warn[1], s.crit[1], 'b-crit')}${seg(s.crit[1], hi, 'b-crit')}
      ${[s.warn[0], s.ideal[0], s.ideal[1], s.warn[1]].map((v) => `<span class="band-h" style="left:${pos(v)}%" aria-hidden="true"></span>`).join('')}
      ${(marcas || []).map((m) => `<span class="band-mark" style="left:${pos(m.v)}%"><span>${m.t}</span></span>`).join('')}
    </div>
    <div class="band-inputs">
      <label><span>Crítico debajo de</span><span class="input-unit"><input value="${fmt(s.warn[0], dec)}"></span></label>
      <label><span>Ideal desde</span><span class="input-unit"><input value="${fmt(s.ideal[0], dec)}"></span></label>
      <label><span>Ideal hasta</span><span class="input-unit"><input value="${fmt(s.ideal[1], dec)}"></span></label>
      <label><span>Crítico arriba de</span><span class="input-unit"><input value="${fmt(s.warn[1], dec)}"></span></label>
    </div>
  </div>`;
}

function senalTxt(dbm) { return dbm < -85 ? 'débil' : dbm < -75 ? 'regular' : 'buena'; }
function barras(dbm) {
  const n = dbm < -85 ? 1 : dbm < -75 ? 2 : dbm < -65 ? 3 : 4;
  return `<span class="bars" aria-hidden="true">${[1, 2, 3, 4].map((i) => `<i class="${i <= n ? 'on' : ''}" style="height:${i * 3 + 2}px"></i>`).join('')}</span>`;
}
function bateria(b) {
  return `<span class="bat ${b < 20 ? 'is-low' : ''}" aria-hidden="true"><i style="width:${b}%"></i></span>`;
}

function hwTabs(activa) {
  const t = (id, href, txt, n) => `<a class="tab" role="tab" href="${href}" aria-selected="${activa === id}">${txt}${n ? ` <span class="n">${n}</span>` : ''}</a>`;
  return `<div class="tabs" role="tablist">${t('res', '#/hardware', 'Resumen')}${t('nodos', '#/hardware/nodos', 'Nodos testigo', '6')}${t('act', '#/hardware/actuadores', 'Actuadores', '1.797')}${t('cam', '#/hardware/camara', 'Cámara y riel', '2')}</div>`;
}

}
