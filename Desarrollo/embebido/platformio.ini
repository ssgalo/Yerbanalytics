; ============================================================================
;  Yerbanalytics - Firmware ESP32 (nodos de vivero)
; ============================================================================
;  TRES firmwares independientes, uno por tipo de nodo. NO hay perfiles ni
;  condicionales de compilación: cada entorno compila SOLO su sketch y las
;  carpetas que ese rol necesita. Se elige el nodo eligiendo el entorno.
;
;   - env:nodo_sensor    -> solo sensado  (nodo testigo por macro-zona)
;   - env:nodo_actuador  -> solo actuación (por sector)
;   - env:nodo_combinado -> sensado + actuación (EL DEL PROTOTIPO)
;
;  Uso:  pio run -e nodo_combinado -t upload
;
;  Código compartido (sin duplicar): comun/ lo usan los tres; sensado/ lo usan
;  sensor y combinado; actuacion/ lo usan actuador y combinado. build_src_filter
;  incluye en cada entorno solo lo que corresponde.
; ============================================================================

[platformio]
src_dir = .

; Placa: ESP32-S3 DevKitC-1 N16R8 (flash 16 MB QIO, PSRAM octal).
; Plataforma pioarduino: trae el core Arduino-ESP32 3.x (ledcAttach, RGB_BUILTIN).
; La "espressif32" oficial de PlatformIO quedó en el core 2.x y no compila este firmware.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -I comun
    -I sensado
    -I actuacion
    -DBOARD_HAS_PSRAM
    ; Serial por el puerto USB nativo de la placa. Si conectás el puerto COM/UART, poné 0.
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ----------------------------------------------------------------------------
;  NODO SENSOR: testigo. Solo lee y publica telemetría.
;  Compila: nodo_sensor.ino + comun/ + sensado/  (sin actuacion/).
; ----------------------------------------------------------------------------
[env:nodo_sensor]
build_src_filter =
    +<nodo_sensor/>
    +<comun/>
    +<sensado/>

; ----------------------------------------------------------------------------
;  NODO ACTUADOR: solo escucha comandos y acciona.
;  Compila: nodo_actuador.ino + comun/ + actuacion/  (sin sensado/).
; ----------------------------------------------------------------------------
[env:nodo_actuador]
build_src_filter =
    +<nodo_actuador/>
    +<comun/>
    +<actuacion/>

; ----------------------------------------------------------------------------
;  NODO COMBINADO: sensado + actuación en un mismo ESP32 (PROTOTIPO).
;  Compila: nodo_combinado.ino + comun/ + sensado/ + actuacion/.
; ----------------------------------------------------------------------------
[env:nodo_combinado]
build_src_filter =
    +<nodo_combinado/>
    +<comun/>
    +<sensado/>
    +<actuacion/>

; ----------------------------------------------------------------------------
;  NODO COMBINADO POR USB: el mismo nodo, pero hablando MQTT por el cable USB
;  (Serial0, puerto UART/CH343) con el puente de la PC. SÓLO PARA LA EXPO: el
;  Wi-Fi de 2,4 GHz no sirve en un salón lleno. Después se vuelve a grabar
;  nodo_combinado. Ver puente-usb/README.md y openspec/changes/add-transporte-usb-nodo.
;  Reemplaza comun/net_wifi.cpp y comun/net_mqtt.cpp por transporte_usb/.
; ----------------------------------------------------------------------------
[env:nodo_combinado_usb]
build_src_filter =
    +<nodo_combinado/>
    +<comun/>
    +<sensado/>
    +<actuacion/>
    +<transporte_usb/>
    -<comun/net_wifi.cpp>
    -<comun/net_mqtt.cpp>
