; ============================================================================
;  Yerbanalytics - Firmware ESP32 (nodos de vivero)
; ============================================================================
;  TRES firmwares independientes, uno por tipo de nodo. NO hay perfiles ni
;  condicionales de compilación: cada entorno compila SOLO su sketch y las
;  carpetas que ese rol necesita. Se elige el nodo eligiendo el entorno.
;
;   - env:nodo_sensor    -> solo sensado  (nodo testigo por macro-zona)
;   - env:nodo_actuador  -> solo actuación (por sector)
;   - env:nodo_combinado -> sensado + actuación (EL DEL PROTOTIPO)
;
;  Uso:  pio run -e nodo_combinado -t upload
;
;  Código compartido (sin duplicar): comun/ lo usan los tres; sensado/ lo usan
;  sensor y combinado; actuacion/ lo usan actuador y combinado. build_src_filter
;  incluye en cada entorno solo lo que corresponde.
; ============================================================================

[platformio]
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I comun
    -I sensado
    -I actuacion
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ----------------------------------------------------------------------------
;  NODO SENSOR: testigo. Solo lee y publica telemetría.
;  Compila: nodo_sensor.ino + comun/ + sensado/  (sin actuacion/).
; ----------------------------------------------------------------------------
[env:nodo_sensor]
build_src_filter =
    +<nodo_sensor/>
    +<comun/>
    +<sensado/>

; ----------------------------------------------------------------------------
;  NODO ACTUADOR: solo escucha comandos y acciona.
;  Compila: nodo_actuador.ino + comun/ + actuacion/  (sin sensado/).
; ----------------------------------------------------------------------------
[env:nodo_actuador]
build_src_filter =
    +<nodo_actuador/>
    +<comun/>
    +<actuacion/>

; ----------------------------------------------------------------------------
;  NODO COMBINADO: sensado + actuación en un mismo ESP32 (PROTOTIPO).
;  Compila: nodo_combinado.ino + comun/ + sensado/ + actuacion/.
; ----------------------------------------------------------------------------
[env:nodo_combinado]
build_src_filter =
    +<nodo_combinado/>
    +<comun/>
    +<sensado/>
    +<actuacion/>
