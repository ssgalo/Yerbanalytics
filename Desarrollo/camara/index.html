<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area en el CSS: el equipo va montado y la barra de iOS
         no debe tapar el indicador de estado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#12301F" />
    <!-- iOS ignora buena parte del manifest; estas tres son las que respeta al agregar a
         la pantalla de inicio. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yerbanalytics Cámara" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Yerbanalytics · Cámara</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
