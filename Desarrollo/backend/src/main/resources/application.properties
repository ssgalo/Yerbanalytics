# Puerto de la aplicación (esperado por el frontend VITE_API_BASE_URL)
server.port=8000

# Nombre de la app
spring.application.name=yerbanalytics-backend

# Configuración del Data Source para PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yerbanalytics
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seeding configuration
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Semilla del generador determinístico (alineada con VITE_MOCK_SEED del frontend)
yerbanalytics.mock.seed=20260613

# Configuración MQTT
yerbanalytics.mqtt.host=tcp://localhost:1883
yerbanalytics.mqtt.client-id=yerbanalytics-backend
yerbanalytics.mqtt.telemetry-topic=nursery/zone/+/telemetry

# Habilitación de simulador local de ESP32
yerbanalytics.mqtt.simulator.enabled=true
yerbanalytics.mqtt.simulator.client-id=yerbanalytics-esp32-simulator
yerbanalytics.mqtt.simulator.interval-ms=10000

# Tiempo máximo de inactividad de sensor antes de marcarlo como offline (30 segundos para la demo)
yerbanalytics.nursery.stale-threshold-ms=30000

# Historial y seguimiento post-acción (HU-11 / HU-12)
# Latencia antes de evaluar la efectividad de una acción (2 min para la demo)
yerbanalytics.historial.latency-ms=120000
yerbanalytics.historial.latency-label=2 min
# Delta mínimo de la métrica para considerar la acción "Efectiva"
yerbanalytics.historial.umbral-recuperacion=5
# Frecuencia del motor de evaluación de seguimiento
yerbanalytics.historial.eval-interval-ms=30000
