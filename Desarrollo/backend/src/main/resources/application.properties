# Puerto de la aplicación (esperado por el frontend VITE_API_BASE_URL)
server.port=8000

# ----------------------------------------------------------------------------
# HTTPS para la app de cámara
# ----------------------------------------------------------------------------
# La PWA de cámara se sirve por HTTPS (getUserMedia exige origen seguro) y una página HTTPS
# no puede llamar a un endpoint HTTP. Por eso el backend expone un conector TLS ADICIONAL en
# el 8443: el 8000 sigue siendo HTTP y el dashboard no se entera.
#
# El keystore se genera con:  Desarrollo/certs/generar-certificados.sh <ip-de-la-maquina>
yerbanalytics.https.enabled=true
yerbanalytics.https.port=8443
yerbanalytics.https.keystore=../certs/servidor.p12
yerbanalytics.https.keystore-password=yerbanalytics

# Nombre de la app
spring.application.name=yerbanalytics-backend

# Orígenes permitidos por CORS. Dashboard (:5173) y app de cámara (:5190).
#
# Se incluyen los rangos privados (RFC 1918) porque la app de cámara NO se abre en localhost:
# el iPhone entra por la IP de la máquina en la red del vivero. Sin esto, el enrolamiento
# falla con un error de CORS que no dice nada útil.
#
# Son patrones (allowedOriginPatterns), no orígenes literales. Si el vivero usa otra subred o
# un hostname (yerba.local), agregalo acá. En un despliegue expuesto a internet, reemplazá
# todo esto por la lista concreta de orígenes.
yerbanalytics.cors.origins=\
  http://localhost:5173,http://localhost:5190,https://localhost:5190,\
  http://127.0.0.1:*,https://127.0.0.1:*,\
  http://192.168.*.*:*,https://192.168.*.*:*,\
  http://10.*.*.*:*,https://10.*.*.*:*,\
  http://172.16.*.*:*,https://172.16.*.*:*,\
  http://*.local:*,https://*.local:*

# Configuración del Data Source para PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yerbanalytics
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Open-in-view APAGADO. Con el patrón request/response clásico sólo era una mala práctica
# (Spring Boot ya lo advierte en el arranque); con el stream SSE de órdenes de captura es
# fatal: mantiene el EntityManager vivo mientras dure el request, y como fuera de una
# transacción Hibernate no suelta la conexión, CADA dispositivo conectado retendría una
# conexión JDBC de forma permanente. Con el pool por defecto (10), diez cámaras dejarían
# la plataforma entera sin conexiones.
# Los servicios ya devuelven DTOs desde métodos @Transactional, así que no dependen de esto.
spring.jpa.open-in-view=false

# Seeding configuration
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Semilla del generador determinístico (alineada con VITE_MOCK_SEED del frontend)
yerbanalytics.mock.seed=20260613

# Configuración MQTT. El backend sólo CONSUME telemetría del broker: quien publica es el
# hardware. Si no hay nodos físicos a mano, se levanta el simulador
# (Desarrollo/simulador/), que publica en este mismo topic haciéndose pasar por un nodo.
yerbanalytics.mqtt.host=tcp://localhost:1883
yerbanalytics.mqtt.client-id=yerbanalytics-backend
yerbanalytics.mqtt.telemetry-topic=nursery/zone/+/telemetry

# Historial y seguimiento post-acción (HU-11 / HU-12)
# Latencia antes de evaluar la efectividad de una acción (2 min para la demo)
yerbanalytics.historial.latency-ms=120000
yerbanalytics.historial.latency-label=2 min
# Delta mínimo de la métrica para considerar la acción "Efectiva"
yerbanalytics.historial.umbral-recuperacion=5
# Frecuencia del motor de evaluación de seguimiento
yerbanalytics.historial.eval-interval-ms=30000

# Estado técnico del hardware (HU-18 / HU-21)
# Umbral de batería para marcar "Batería Baja" (HU-21 CA-02)
yerbanalytics.hardware.bateria-min-pct=20
# Sin heartbeat: umbral para "Señal intermitente" (en prod ~2 h; 60 s para la demo)
yerbanalytics.hardware.watchdog-intermitente-ms=60000
# Sin heartbeat: umbral para "Fuera de servicio" (en prod ~24 h; 120 s para la demo)
yerbanalytics.hardware.watchdog-critico-ms=120000

# =============================================================================
# Motor de Reglas (add-rules-engine)
# =============================================================================

# Cooldown mínimo entre acciones del mismo tipo sobre el mismo sector.
# Evita inundaciones de comandos si el sensor reporta muy seguido.
yerbanalytics.engine.action-cooldown-minutes=30

# Los umbrales de las reglas (antigüedad de la lectura, lluvia, UV, confianza mínima, etc.)
# viven en el catálogo de parámetros (GET/PUT /api/rules/parametros), no acá.

# Intervalo del Watchdog proactivo (ms). Default: 5 minutos.
# Evalúa todos los sectores aunque no haya telemetría reciente.
yerbanalytics.engine.watchdog-interval-ms=300000

# Despacho de riego por tandas (infraestructura, no agronomía: por eso va acá y no en el catálogo).
# Cada tick el despacho cierra lo vencido (duración + 5 s) y abre los sectores que entren en el cupo
# `riego.sectores-simultaneos` de cada macro-zona. 10 s = lo que tarda en liberarse un lugar, como mucho.
yerbanalytics.riego.despacho-intervalo-ms=10000

# Fecha de siembra del ciclo actual (formato ISO yyyy-MM-dd).
# Usada por ShadingRule para calcular el día del plan de rustificación.
# Dejar vacío para deshabilitar el plan de rustificación.
yerbanalytics.nursery.sowing-date-iso=

# =============================================================================
# WeatherService (cliente de API climática)
# =============================================================================

# Coordenadas del vivero (usadas por OpenMeteoWeatherClient).
# Default: Posadas, Misiones, Argentina.
yerbanalytics.weather.lat=-27.36
yerbanalytics.weather.lon=-55.90

# TTL de la cache del pronóstico (ms). Default: 15 minutos.
yerbanalytics.weather.cache-ttl-ms=900000

# Reintentos antes de declarar degradación del servicio climático.
yerbanalytics.weather.max-retries=3

# Espera base del backoff exponencial entre reintentos (ms). Escala: 1s → 2s → 4s.
yerbanalytics.weather.retry-base-ms=1000

# Cuánto se recuerda un fallo del servicio climático (ms): durante ese lapso no se reintenta ni se espera, así
# que sin internet el motor evalúa sin pronóstico en lugar de trabarse en cada mensaje. Default: 60 s.
yerbanalytics.weather.failure-cache-ttl-ms=60000

# Timeouts HTTP de la consulta a Open-Meteo (ms). Sin ellos una API que no responde cuelga el hilo de refresco y el
# pronóstico pasa a "sin dato" en silencio. Defaults: 3 s de conexión y 5 s de lectura.
yerbanalytics.weather.connect-timeout-ms=3000
yerbanalytics.weather.read-timeout-ms=5000

# ----------------------------------------------------------------------------
# Captura de imágenes cenitales (HU-04 CA-01)
# Contrato del dispositivo: Desarrollo/contratos/camara/v1/
# ----------------------------------------------------------------------------
# Directorio raíz de los JPEG (particionado AAAA/MM/DD). Fuera de la base a propósito:
# 600 sectores por varios ciclos diarios inflarían el pg_dump y la replicación.
yerbanalytics.capturas.dir=./capturas
# Plazo de una orden antes de que el watchdog la venza
yerbanalytics.capturas.timeout-orden-seg=60
# Intentos máximos antes de mandar la orden a ERROR
yerbanalytics.capturas.max-intentos=3
# Frecuencia del barrido de órdenes vencidas
yerbanalytics.capturas.watchdog-interval-ms=10000

# Credenciales del dispositivo. El secreto DEBE sobrescribirse en producción.
yerbanalytics.capturas.jwt-secret=cambiar-en-produccion-yerbanalytics-camara-v1
yerbanalytics.capturas.token-vida-seg=900
yerbanalytics.capturas.codigo-vida-seg=600

# Heartbeat del dispositivo y umbrales de silencio (espejan los de hardware)
yerbanalytics.capturas.heartbeat-seg=15
yerbanalytics.capturas.watchdog-intermitente-ms=60000
yerbanalytics.capturas.watchdog-critico-ms=120000

# Canal SSE de órdenes
yerbanalytics.capturas.sse-keep-alive-ms=20000
yerbanalytics.capturas.sse-timeout-ms=3600000

# Configuración que baja al dispositivo (NO vive en el cliente)
yerbanalytics.capturas.ancho-max=1920
yerbanalytics.capturas.alto-max=1080
yerbanalytics.capturas.calidad-jpeg=0.85
# Techo de calentamiento antes de disparar. 500 ms alcanzaban para el canvas de la PWA, pero
# quedan por debajo de lo que tarda un 3A real (AF+AE+AWB) en un arranque en frío: con ese valor
# el cliente Android nunca llegaba a converger y todas las primeras fotos de ráfaga salían con la
# exposición sin cerrar. Es un techo, no una espera fija: la ráfaga sigue saliendo antes.
yerbanalytics.capturas.warmup-ms=1500
yerbanalytics.capturas.max-cola-ordenes=20

# Tamaño máximo de la subida multipart de una captura
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# El token del stream SSE viaja por query string (limitación de EventSource, no del
# protocolo). Si alguna vez se habilita el access log, el patrón NO debe incluir la query
# string: %U es la ruta sin query; %r la incluiría y filtraría el token a los logs.
server.tomcat.accesslog.enabled=false
server.tomcat.accesslog.pattern=%h %l %u %t "%m %U" %s %b

# ----------------------------------------------------------------------------
# Pasada del riel (planificador): mueve el riel, pide las fotos y vuelve a home.
# Sin evento del riel a estos segundos se republica el comando; al doble, RIEL_SIN_RESPUESTA
yerbanalytics.pasada.timeout-aceptacion-seg=5
# Plazo de un movimiento (cubre pos2->home de 42 s y un homing completo de 80 s)
yerbanalytics.pasada.timeout-movimiento-seg=120
# Plazo de una foto (3 intentos de 60 s de la orden mas el barrido del watchdog)
yerbanalytics.pasada.timeout-captura-seg=240
# Cadencia del tick del orquestador
yerbanalytics.pasada.tick-ms=1000

# ----------------------------------------------------------------------------
# Autenticación y permisos (HU-01 / HU-20). Ver "Autenticación y permisos" en el README.
# ----------------------------------------------------------------------------
# Administrador inicial: se crea al arrancar SÓLO si no hay ningún Administrador activo, y se le
# pide cambiar la contraseña en el primer ingreso. Si YERBANALYTICS_ADMIN_CLAVE no está definida,
# se genera una aleatoria y se escribe UNA vez en el log de arranque.
yerbanalytics.auth.admin-inicial.usuario=admin
yerbanalytics.auth.admin-inicial.clave=${YERBANALYTICS_ADMIN_CLAVE:}
# Atributo Secure de la cookie de sesión. Apagado porque el dashboard corre por HTTP en la LAN;
# encendelo si se sirve todo por HTTPS. Dashboard y API tienen que compartir esquema y host.
yerbanalytics.auth.cookie-secure=false
# Barrido de sesiones cerradas o vencidas hace más de 7 días.
yerbanalytics.auth.barrido-cron=0 30 3 * * *
# Los usuarios viven en la base (tabla usuario), no en el usuario en memoria que Spring Boot crea
# por defecto con una contraseña generada.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
