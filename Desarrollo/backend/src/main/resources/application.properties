# Puerto de la aplicación (esperado por el frontend VITE_API_BASE_URL)
server.port=8000

# Nombre de la app
spring.application.name=yerbanalytics-backend

# Configuración del Data Source para PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yerbanalytics
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seeding configuration
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Semilla del generador determinístico (alineada con VITE_MOCK_SEED del frontend)
yerbanalytics.mock.seed=20260613

# Configuración MQTT
yerbanalytics.mqtt.host=tcp://localhost:1883
yerbanalytics.mqtt.client-id=yerbanalytics-backend
yerbanalytics.mqtt.telemetry-topic=nursery/zone/+/telemetry

# Simulador local de ESP32. Apagado por defecto: el modo de operación se controla en runtime
# desde el dashboard de simulación (SimulacionService). El intervalo aplica al simulador
# automático cuando se activa; el client-id se reutiliza como base para las publicaciones.
yerbanalytics.mqtt.simulator.enabled=false
yerbanalytics.mqtt.simulator.client-id=yerbanalytics-esp32-simulator
yerbanalytics.mqtt.simulator.interval-ms=10000

# Tiempo máximo de inactividad de sensor antes de marcarlo como offline (30 segundos para la demo)
yerbanalytics.nursery.stale-threshold-ms=30000

# Historial y seguimiento post-acción (HU-11 / HU-12)
# Latencia antes de evaluar la efectividad de una acción (2 min para la demo)
yerbanalytics.historial.latency-ms=120000
yerbanalytics.historial.latency-label=2 min
# Delta mínimo de la métrica para considerar la acción "Efectiva"
yerbanalytics.historial.umbral-recuperacion=5
# Frecuencia del motor de evaluación de seguimiento
yerbanalytics.historial.eval-interval-ms=30000

# Estado técnico del hardware (HU-18 / HU-21)
# Umbral de batería para marcar "Batería Baja" (HU-21 CA-02)
yerbanalytics.hardware.bateria-min-pct=20
# Sin heartbeat: umbral para "Señal intermitente" (en prod ~2 h; 60 s para la demo)
yerbanalytics.hardware.watchdog-intermitente-ms=60000
# Sin heartbeat: umbral para "Fuera de servicio" (en prod ~24 h; 120 s para la demo)
yerbanalytics.hardware.watchdog-critico-ms=120000

# =============================================================================
# Motor de Reglas (add-rules-engine)
# =============================================================================

# Cooldown mínimo entre acciones del mismo tipo sobre el mismo sector.
# Evita inundaciones de comandos si el sensor reporta muy seguido.
yerbanalytics.engine.action-cooldown-minutes=30

# Umbral de probabilidad de lluvia (%) para postponer el riego (WeatherOverrideRule).
yerbanalytics.engine.rain-threshold-pct=60.0

# Umbral de índice UV para activar protección de mediasombra (ShadingRule).
yerbanalytics.engine.uv-threshold=7.0

# Intervalo del Watchdog proactivo (ms). Default: 5 minutos.
# Evalúa todos los sectores aunque no haya telemetría reciente.
yerbanalytics.engine.watchdog-interval-ms=300000

# Fecha de siembra del ciclo actual (formato ISO yyyy-MM-dd).
# Usada por ShadingRule para calcular el día del plan de rustificación.
# Dejar vacío para deshabilitar el plan de rustificación.
yerbanalytics.nursery.sowing-date-iso=

# =============================================================================
# WeatherService (cliente de API climática)
# =============================================================================

# Coordenadas del vivero (usadas por OpenMeteoWeatherClient).
# Default: Posadas, Misiones, Argentina.
yerbanalytics.weather.lat=-27.36
yerbanalytics.weather.lon=-55.90

# TTL de la cache del pronóstico (ms). Default: 15 minutos.
yerbanalytics.weather.cache-ttl-ms=900000

# Reintentos antes de declarar degradación del servicio climático.
yerbanalytics.weather.max-retries=3

# Espera base del backoff exponencial entre reintentos (ms). Escala: 1s → 2s → 4s.
yerbanalytics.weather.retry-base-ms=1000
