# Configuración de DESARROLLO / LAN de Mosquitto. SIN autenticación ni TLS: cualquiera que
# llegue al puerto 1883 puede publicar y suscribirse. No exponer fuera de una red de confianza.
#
# Por qué existe: Mosquitto 2 sin archivo de configuración arranca en modo "local only" y no
# acepta conexiones de otras máquinas, por lo que un ESP32 en la LAN no podría conectarse.
# Se monta en /mosquitto/config/mosquitto.conf desde docker-compose.yml.

listener 1883
allow_anonymous true

# Persistencia en el volumen mosquitto-data (sobrevive al reinicio del contenedor).
persistence true
persistence_location /mosquitto/data/

# Log a stdout (docker logs) y al volumen mosquitto-log.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
