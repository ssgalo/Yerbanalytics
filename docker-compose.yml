version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Sólo MQTT sobre TCP. El 9001 (MQTT sobre WebSockets) no se publica:
      # existe para que un navegador pueda hablar MQTT, y acá nadie lo hace.
      # Las órdenes de captura van por SSE — la decisión y su porqué están en
      # CapturaService.java. Además el listener de WebSockets ni siquiera está
      # configurado (ver mosquitto.conf), así que el mapeo publicaba un
      # puerto sin nada detrás, y chocaba con otros servicios de la máquina.
      - "1883:1883"
    volumes:
      # Deja explícito que el broker escucha en la LAN sin autenticación (lo necesita el ESP32).
      - ./Desarrollo/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  yerbanalytics-db:
    image: postgres:17-alpine
    container_name: yerbanalytics-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yerbanalytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data

  servicio-inferencia:
    build:
      context: ./Desarrollo/servicio-inferencia
      dockerfile: Dockerfile
    container_name: servicio-inferencia
    restart: unless-stopped
    environment:
      # URL del backend (Spring Boot) que corre en la máquina host en el puerto 8000
      BACKEND_URL: http://host.docker.internal:8000
      # Cuenta de rol Servicio con la que inicia sesión en el backend. El backend la crea al
      # arrancar (YERBANALYTICS_USUARIOS_INICIALES en Desarrollo/backend/env.example). El default
      # es la clave de DESARROLLO de ese archivo; fuera de desarrollo se pasa por entorno:
      #     INFERENCIA_BACKEND_CLAVE=... docker compose up -d servicio-inferencia
      BACKEND_USUARIO: ${INFERENCIA_BACKEND_USUARIO:-inferencia}
      BACKEND_CLAVE: ${INFERENCIA_BACKEND_CLAVE:-inferencia-yerba-2026}
      # Directorio de capturas montado como volumen compartido.
      CAPTURAS_DIR: /capturas
      # Intervalo de polling en segundos. El default de 4 horas es el ritmo de
      # operación real; para una demo o una prueba hay que bajarlo, y eso se
      # hace por entorno, no editando este archivo:
      #     POLLING_INTERVAL_SECONDS=20 docker compose up -d servicio-inferencia
      POLLING_INTERVAL_SECONDS: ${POLLING_INTERVAL_SECONDS:-14400}
      # Ruta al .pt dentro del contenedor (montado en volumes más abajo).
      MODEL_PATH: /modelo_final.pt
      # Orden de clases del modelo entrenado. NO es la taxonomía del backend:
      # es la lista de estados reordenada para que la posición N de esta lista
      # corresponda a la clase N del modelo. model.py mapea por índice, no por
      # nombre (al arrancar loguea el mapeo y exige la misma cantidad de clases),
      # así que un orden equivocado produce diagnósticos plausibles y errados.
      #
      # Fuente de verdad: el propio checkpoint.
      #     docker compose run --rm --entrypoint python servicio-inferencia \
      #       -c "from ultralytics import YOLO; print(YOLO('/modelo_final.pt').names)"
      #
      # modelo_final.pt (YOLOv8, detect, imgsz 1024, 5 clases) declara:
      #   0 clorosis · 1 colapso_hongos · 2 estres_solar · 3 plaga_foliar · 4 sano
      MODEL_CLASSES: "Clorosis,Daño fúngico,Estrés solar,Plaga foliar,Sano"
      # Parámetros del equipo para el módulo de diagnóstico (ver README del servicio).
      # PROVISORIOS hasta calibrarlos con las curvas PR; se cambian por entorno:
      #     BANDAS_CONFIANZA_CLOROSIS=0.45,0.60,0.75 docker compose up -d servicio-inferencia
      # Bandas = "válida desde, media desde, alta desde" sobre el score crudo.
      YOLO_CONF_GLOBAL: ${YOLO_CONF_GLOBAL:-0.10}
      SOLAPAMIENTO_IOU: ${SOLAPAMIENTO_IOU:-0.60}
      BANDAS_CONFIANZA_SANO: ${BANDAS_CONFIANZA_SANO:-0.60,0.70,0.80}
      BANDAS_CONFIANZA_CLOROSIS: ${BANDAS_CONFIANZA_CLOROSIS:-0.40,0.55,0.70}
      BANDAS_CONFIANZA_ESTRES_SOLAR: ${BANDAS_CONFIANZA_ESTRES_SOLAR:-0.40,0.55,0.70}
      BANDAS_CONFIANZA_PLAGA_FOLIAR: ${BANDAS_CONFIANZA_PLAGA_FOLIAR:-0.35,0.50,0.65}
      BANDAS_CONFIANZA_DANO_FUNGICO: ${BANDAS_CONFIANZA_DANO_FUNGICO:-0.35,0.50,0.65}
    volumes:
      # Volumen compartido de imágenes con el backend.
      - ./Desarrollo/backend/capturas:/capturas
      # El modelo no se versiona (*.pt en .gitignore): se monta desde la carpeta del servicio.
      - ./Desarrollo/servicio-inferencia/modelo_final.pt:/modelo_final.pt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - yerbanalytics-db

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
  # Volumen compartido entre backend y servicio de inferencia.
  capturas-data:
